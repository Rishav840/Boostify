# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fe7d8db65538c6a7aa598e4a0dae166f"
name = "boostify"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_discounts: the Product Bundles checkout discount (extensions/bundle-discount).
# read_products: the product picker for bundles and cart recommendations.
# Everything else is Boostify's own settings (app-owned metafields) and the shop's time zone,
# which need no access scope.
scopes = "read_products,write_discounts"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
